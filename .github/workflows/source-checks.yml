name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check publication content and documentation
        run: python3 Tools/3ds/check_publication.py
      - name: Run synthetic host checks
        run: python3 Tools/3ds/test_public_host.py
      - name: Check native offline conversion and bank formats
        run: |
          python3 Tools/3ds/test_j3d_native_geometry.py --output Build/ci-native-geometry
          python3 Tools/3ds/test_j3d_native_materials.py --output Build/ci-native-materials
          python3 Tools/3ds/test_native_pack.py --output Build/ci-native-mesh
          python3 Tools/3ds/test_native_texture_pack.py --output Build/ci-native-textures
          python3 Tools/3ds/test_native_material_pack.py --output Build/ci-native-fragments
